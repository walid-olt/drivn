server {
	listen 80;
	listen [::]:80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# uploaded car/agency images can get large
	client_max_body_size 20m;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_types
		text/plain
		text/css
		text/javascript
		application/javascript
		application/json
		application/manifest+json
		image/svg+xml;

	# container healthcheck
	location = /healthz {
		access_log off;
		add_header Content-Type text/plain;
		return 200 'ok';
	}

	# Hashed build output — safe to cache forever.
	# NOTE: `add_header` in a location resets the inherited set, so the
	# security headers from the server block are repeated here.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		add_header X-Content-Type-Options nosniff;
		add_header X-Frame-Options SAMEORIGIN;
		add_header Referrer-Policy strict-origin-when-cross-origin;
		try_files $uri =404;
	}

	# Everything else is the SPA router
	location / {
		try_files $uri $uri/ /index.html;
	}

	# index.html must never be cached, otherwise deploys serve stale asset refs
	location = /index.html {
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		add_header X-Content-Type-Options nosniff;
		add_header X-Frame-Options SAMEORIGIN;
		add_header Referrer-Policy strict-origin-when-cross-origin;
	}

	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options SAMEORIGIN always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;
}

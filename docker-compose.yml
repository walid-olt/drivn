services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
    volumes:
      - mongo-data:/data/db

  # Redis Instance (Uncomment to enable)
  # redis:
  #   image: redis:latest
  #   container_name: redis_container
  #   restart: always
  #   ports:
  #     - "6379:6379"

volumes:
  mongo-data:

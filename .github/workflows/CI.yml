name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # run only on pull requests to avoid running twice on push events
    if: ${{ github.event_name == 'pull_request' }}
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2 # Needed for git diff checks if using branch comparisons

      - name: Setup Node.js and pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo Cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Lint
        run: npx turbo run lint

      - name: Test
        run: npx turbo run test

      - name: Build
        run: npx turbo run build
